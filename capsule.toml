# capsule.toml — capsule's own development environment.
#
# `capsule up` starts a container from this file with the project mounted at
# workdir, drops you into a shell, and destroys the container on exit.
# Nothing survives except the volumes named under [persist].

name    = "capsule"
image   = "golang:1-alpine"
shell   = "/bin/sh"
workdir = "/workspace"

packages = ["git", "make"]

[env]
CGO_ENABLED = "0"

# Named volumes that survive teardown — the only state a capsule keeps.
[persist]
gomod = "/go/pkg/mod"  # Go module cache
